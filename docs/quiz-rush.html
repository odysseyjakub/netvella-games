<!doctype html>
<html lang="ga">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4efe4">
  <title>Quiz Rush — Notelet</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Silkscreen&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:light;--paper:#f4efe4;--ink:#17120d;--muted:#6b6152;--yellow:#ffbf1f;--pink:#ff3d8b;--blue:#39aaf5;--mint:#53d6a2;--line:rgba(23,18,13,.2);--display:'Bricolage Grotesque',system-ui,sans-serif;--pixel:'Silkscreen',monospace;--ease:cubic-bezier(.22,1,.36,1)}*{box-sizing:border-box}body{min-width:320px;min-height:100vh;margin:0;color:var(--ink);font:16px/1.45 var(--display);background:var(--paper) repeating-linear-gradient(transparent 0 31px,rgba(23,18,13,.045) 31px 32px)}button,select{font:inherit;color:inherit}.topbar{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,4vw,48px);border-bottom:2px solid var(--ink);background:rgba(244,239,228,.94)}a{color:inherit;text-decoration:none}.brand{display:flex;align-items:center;gap:8px;font:10px var(--pixel);letter-spacing:.1em}.brand-mark{width:30px;height:30px}.back{font-size:12px;font-weight:800}.game{width:min(880px,100%);margin:auto;padding:clamp(22px,5vw,48px) 20px}.setup,.quiz,.result{border:2px solid var(--ink);background:rgba(255,255,255,.76);box-shadow:6px 6px 0 var(--ink)}.setup{max-width:620px;margin:6vh auto;padding:clamp(24px,6vw,50px);text-align:center}.eyebrow{margin:0 0 10px;font:7px var(--pixel);letter-spacing:.1em;color:#594d3e}h1{margin:0;font-size:clamp(43px,8vw,76px);line-height:.9;letter-spacing:-.07em}h1 span{color:var(--pink)}.sub{max-width:440px;margin:14px auto 24px;color:var(--muted)}.settings{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}.settings label{display:grid;gap:5px;text-align:left;font:7px var(--pixel)}select{min-height:42px;min-width:170px;padding:6px 10px;border:2px solid var(--ink);background:white}.primary{min-height:48px;padding:10px 22px;border:2px solid var(--ink);background:var(--yellow);box-shadow:4px 4px 0 var(--ink);font-weight:800;cursor:pointer;transition:transform .16s var(--ease)}.primary:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}.quiz{display:none;max-width:760px;margin:2vh auto;padding:clamp(18px,4vw,34px)}.quiz.active,.result.active{display:block}.hud{display:flex;align-items:center;justify-content:space-between;gap:8px;font:7px var(--pixel)}.hud b{font:800 14px var(--display)}.timer{height:10px;margin:14px 0 20px;border:2px solid var(--ink);background:#fff}.timer-fill{width:100%;height:100%;background:var(--pink);transform-origin:left}.question-meta{color:var(--muted);font:7px var(--pixel)}.question{min-height:90px;margin:8px 0 22px;font-size:clamp(25px,5vw,40px);line-height:1.05;letter-spacing:-.04em}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.answer{min-height:76px;display:flex;align-items:center;gap:12px;padding:12px;border:2px solid var(--ink);background:#fff;text-align:left;font-weight:800;cursor:pointer;transition:transform .16s var(--ease),background .16s}.answer:hover:not(:disabled){transform:translateY(-3px);box-shadow:3px 3px 0 var(--ink)}.answer .shape{width:25px;height:25px;flex:0 0 auto;display:grid;place-items:center;background:var(--blue);font-weight:900}.answer:nth-child(2) .shape{background:var(--pink)}.answer:nth-child(3) .shape{background:var(--yellow)}.answer:nth-child(4) .shape{background:var(--mint)}.answer.correct{background:rgba(83,214,162,.42)}.answer.wrong{background:rgba(255,61,139,.2)}.answer:disabled{cursor:default}.feedback{min-height:25px;margin:14px 0 0;color:var(--muted);font-weight:700}.result{display:none;max-width:620px;margin:6vh auto;padding:clamp(24px,6vw,48px);text-align:center}.result h2{margin:0;font-size:clamp(36px,7vw,64px);line-height:.95;letter-spacing:-.06em}.final-score{display:block;margin:16px 0;font-size:clamp(32px,7vw,55px);font-weight:800}.review{margin:18px 0;padding:12px;border-top:1px solid var(--line);text-align:left;color:var(--muted);font-size:13px}.review p{margin:6px 0}.result-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.secondary{min-height:46px;padding:9px 16px;border:2px solid var(--ink);background:transparent;font-weight:800;cursor:pointer}@media(max-width:560px){.answers{grid-template-columns:1fr;gap:7px}.answer{min-height:55px}.question{min-height:70px}.hud{font-size:6px}.setup{margin-top:3vh}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <header class="topbar"><a class="brand" href="./index.html"><svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" shape-rendering="crispEdges"><path fill="#17120d" d="M5 24 22 5l6 5L11 29H5z"/><path fill="#ffbf1f" d="m7 23 15-16 3 3-15 17H7z"/><path fill="#ff3d8b" d="m22 5 3-2 5 5-2 2z"/></svg>NOTELET</a><a class="back" href="./index.html">← Gach cluiche</a></header>
  <main class="game">
    <section class="setup" id="setup"><p class="eyebrow">03 · BABHTA LUAS</p><h1>Quiz <span>Rush.</span></h1><p class="sub">Deich gceist. Clog ag comhaireamh síos. Gach freagra ceart níos tapúla = níos mó pointí.</p><div class="settings"><label>ÁBHAR<select id="subject"><option value="ga">Gaeilge</option><option value="maths">Matamaitic</option><option value="science">Eolaíocht</option></select></label><label>LUAS<select id="pace"><option value="12">12 soicind · socair</option><option value="8" selected>8 soicind · tapa</option><option value="5">5 soicind · craiceáilte</option></select></label></div><button class="primary" id="start">Tosaigh an babhta →</button></section>
    <section class="quiz" id="quiz" aria-live="polite"><div class="hud"><span>CEIST <b id="count">1 / 10</b></span><span>TEAGLAMA <b id="streak">0×</b></span><span>SCÓR <b id="score">0</b></span></div><div class="timer"><div class="timer-fill" id="timer-fill"></div></div><p class="question-meta" id="meta">Gaeilge · Focal agus brí</p><h2 class="question" id="question"></h2><div class="answers" id="answers"></div><p class="feedback" id="feedback" role="status"></p></section>
    <section class="result" id="result"><p class="eyebrow">BABHTA CRÍOCHNAITHE</p><h2 id="result-title">Maith thú.</h2><strong class="final-score" id="final-score">0</strong><p id="result-copy">Pointe</p><div class="review" id="review"></div><div class="result-actions"><button class="primary" id="again">Imir arís</button><a class="secondary" href="./index.html">Gach cluiche</a></div></section>
  </main>
  <script>
    const banks={ga:[['Cén Ghaeilge atá ar “water”?','uisce',['uisce','tine','bainne','abhainn']],['Cén Ghaeilge atá ar “friend”?','cara',['cara','scoil','madra','deartháir']],['Cén Ghaeilge atá ar “beautiful”?','álainn',['álainn','mall','dona','beag']],['Cén Ghaeilge atá ar “tomorrow”?','amárach',['inné','inniu','amárach','maidin']],['Cén Ghaeilge atá ar “thank you”?','go raibh maith agat',['le do thoil','slán','tá','go raibh maith agat']],['Cén Ghaeilge atá ar “book”?','leabhar',['leabhar','peann','cathaoir','bord']],['Cén Ghaeilge atá ar “happy”?','sásta',['tuirseach','sásta','fuar','te']],['Cén Ghaeilge atá ar “school”?','scoil',['baile','scoil','siopa','cluiche']],['Cén Ghaeilge atá ar “please”?','le do thoil',['slán','le do thoil','go raibh maith agat','maith']],['Cén Ghaeilge atá ar “night”?','oíche',['maidin','lá','oíche','seachtain']]],maths:[['Cé mhéad atá 8 × 7?','56',['54','56','63','48']],['Cé mhéad atá 144 ÷ 12?','12',['10','11','12','14']],['Cad é 25% de 80?','20',['15','20','25','40']],['Cad é achar cearnóige le sleasa 6 cm?','36 cm²',['12 cm²','24 cm²','36 cm²','30 cm²']],['Réitigh: 3x = 21','x = 7',['x = 6','x = 7','x = 8','x = 9']],['Cé mhéad céim atá i dtriantán?','180°',['90°','180°','270°','360°']],['Cad é 0.5 mar chodán?','1/2',['1/4','1/3','1/2','2/3']],['Príomhuimhir í 17?','Tá',['Tá','Níl','Uaireanta','Ní fios']],['Cad é 9²?','81',['18','72','81','99']],['Cé mhéad cm atá i méadar?','100',['10','50','100','1000']]],science:[['Cén gás a ionsúnn plandaí?','Dé-ocsaíd charbóin',['Ocsaigin','Hidrigin','Dé-ocsaíd charbóin','Nítrigin']],['Cad é lár an adaimh?','An núicléas',['An leictreon','An núicléas','An bhlaosc','An móilín']],['Cén fórsa a tharraingíonn rudaí i dtreo an Domhain?','Domhantarraingt',['Frithchuimilt','Maighnéadas','Domhantarraingt','Brú']],['Cén orgán a phumpálann fuil?','An croí',['An scamhóg','An croí','An t-ae','An duán']],['Cad é H₂O?','Uisce',['Salann','Uisce','Ocsaigin','Siúcra']],['Cén pláinéad is gaire don Ghrian?','Mearcair',['Mars','Domhan','Mearcair','Iúpatar']],['Cén fuinneamh a fhaighimid ón nGrian?','Solas agus teas',['Solas agus teas','Fuaim','Maighnéadas','Leictreachas amháin']],['Cén chuid den chill a iompraíonn DNA?','An núicléas',['An scannán','An cíteaplasma','An núicléas','An balla']],['Cad a tharlaíonn d’uisce ag 100°C?','Fiuchann sé',['Reonn sé','Fiuchann sé','Imíonn sé','Éiríonn sé soladach']],['Cén cineál ainmhí í an bheach?','Feithid',['Mamach','Éan','Feithid','Reiptíl'] ]]} ;
    const $=id=>document.getElementById(id);let deck=[],index=0,score=0,streak=0,timer=null,locked=false,missed=[];
    function start(){deck=[...banks[$('subject').value]].sort(()=>Math.random()-.5);index=score=streak=0;missed=[];$('setup').style.display='none';$('result').classList.remove('active');$('quiz').classList.add('active');showQuestion()}
    function showQuestion(){locked=false;const [prompt,correct,options]=deck[index];$('count').textContent=`${index+1} / ${deck.length}`;$('streak').textContent=`${streak}×`;$('score').textContent=score.toLocaleString('ga-IE');$('meta').textContent=`${$('subject').selectedOptions[0].textContent} · ${index+1} de 10`;$('question').textContent=prompt;$('feedback').textContent='';$('answers').replaceChildren(...options.map((text,n)=>{const b=document.createElement('button');b.className='answer';b.innerHTML=`<span class="shape">${['◆','●','▲','■'][n]}</span><span>${text}</span>`;b.addEventListener('click',()=>answer(text,correct,b));return b}));runTimer(Number($('pace').value))}
    function runTimer(seconds){clearInterval(timer);const startAt=Date.now();$('timer-fill').style.transition='none';$('timer-fill').style.transform='scaleX(1)';requestAnimationFrame(()=>{$('timer-fill').style.transition=`transform ${seconds}s linear`;$('timer-fill').style.transform='scaleX(0)'});timer=setTimeout(()=>{if(!locked)answer('',deck[index][1],null)},seconds*1000)}
    function answer(choice,correct,button){if(locked)return;locked=true;clearTimeout(timer);document.querySelectorAll('.answer').forEach(b=>b.disabled=true);if(choice===correct){streak++;const bonus=Math.ceil((Number($('pace').value))*3);score+=100+bonus*Math.min(streak,5);button?.classList.add('correct');$('feedback').textContent=`Ceart! +${100+bonus*Math.min(streak,5)} · ${streak>1?`Teaglama ${streak}×`:''}`.trim()}else{streak=0;if(choice)button?.classList.add('wrong');const correctButton=[...document.querySelectorAll('.answer')].find(b=>b.textContent.includes(correct));correctButton?.classList.add('correct');missed.push(`Ceist ${index+1}: ${correct}`);$('feedback').textContent=choice?`Freagra ceart: ${correct}`:`Am istigh! Freagra ceart: ${correct}`}setTimeout(()=>{index++;if(index===deck.length)finish();else showQuestion()},850)}
    function finish(){clearTimeout(timer);$('quiz').classList.remove('active');$('result').classList.add('active');$('final-score').textContent=score.toLocaleString('ga-IE');$('result-title').textContent=score>=1000?'Maith thú!':score>=500?'Babhta maith!':'Babhta críochnaithe!';$('result-copy').textContent=`${score} pointe · ${deck.length-missed.length}/${deck.length} freagra ceart`;$('review').innerHTML=missed.length?`<strong>Ceisteanna le cleachtadh</strong>${missed.map(item=>`<p>${item}</p>`).join('')}`:'Gach freagra ceart — foirfe!'}
    $('start').addEventListener('click',start);$('again').addEventListener('click',start);
  </script>
</body>
</html>
